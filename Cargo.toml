[package]
name = "kindle-sender"
version = "1.1.0"
edition = "2021"
authors = ["Motti"]
description = "A Linux desktop app and CLI that repairs ebooks for Kindle and emails them via Send-to-Kindle"
license = "MIT"

[dependencies]
slint = "1.9"
rfd = "0.15"

clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
regex = "1.10"
ureq = { version = "2.10", features = ["tls", "json"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }
keyring = { version = "3", features = ["sync-secret-service"], default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3.10"
dirs = "5.0"
walkdir = "2.5"
anyhow = "1.0"
thiserror = "2.0"
encoding_rs = "0.8.42"
roxmltree = "0.21.2"
base64 = "0.23.1"
html5ever = "0.39"
markup5ever_rcdom = "0.39.0"
pdf-extract = "0.12.1"

[dev-dependencies]
tempfile = "3.10"


[build-dependencies]
slint-build = "1.9"
