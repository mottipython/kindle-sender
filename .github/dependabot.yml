version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # markup5ever_rcdom is built against one html5ever release; bumping html5ever
      # alone breaks the build. Revisit when rcdom publishes a matching version.
      - dependency-name: html5ever
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
