<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#e4e6ea"/>
    </linearGradient>
  </defs>
  <!-- e-reader body -->
  <rect x="10" y="4" width="44" height="56" rx="5" fill="#2f3640"/>
  <!-- screen -->
  <rect x="15" y="9" width="34" height="40" rx="2" fill="url(#page)"/>
  <!-- lines of text -->
  <g fill="#9aa3ad">
    <rect x="19" y="14" width="26" height="2.4" rx="1.2"/>
    <rect x="19" y="19" width="26" height="2.4" rx="1.2"/>
    <rect x="19" y="24" width="18" height="2.4" rx="1.2"/>
  </g>
  <!-- envelope arriving on the page -->
  <g transform="translate(19,29)">
    <rect x="0" y="0" width="26" height="16" rx="2" fill="#1a7f37"/>
    <path d="M0 2 L13 11 L26 2" fill="none" stroke="#e6f4ea" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- home bar -->
  <rect x="26" y="53" width="12" height="3" rx="1.5" fill="#7b8794"/>
</svg>
